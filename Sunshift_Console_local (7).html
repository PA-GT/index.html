<!doctype html><html lang="fr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D1A15"><title>Sunshift Console</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B7A4B'/%3E%3Cpath d='M5 21c5 0 5-9 10-9s5 9 12 9' fill='none' stroke='%23DCF0E4' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='9' r='2.2' fill='%23F1B53C'/%3E%3C/svg%3E"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sunshift. Encre vert profond pour la structure, vert « excédent » pour ce qui est utilisable,
   ambre pour le solaire, bleu pour l'éolien, orange brûlé pour le fossile. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#EDEFEA; --line:#E0E3DC; --line-2:#C9CFC6;
  --ink:#0D1A15; --muted:#55615A; --faint:#8C978F;
  --accent:#0B7A4B; --accent-soft:#DCF0E4; --band:rgba(11,122,75,.10);
  --solar:#C98400; --solar-soft:#FAEDCF; --wind:#2563C9; --wind-soft:#E1E9F8;
  --fossil:#C2410C; --fossil-soft:#FBE5D8; --red:#B42318; --red-soft:#FCE6E3;
  --on-ink:#FFFFFF; --side:#0D1A15; --side-ink:#E8EEEA; --side-muted:#93A39A; --side-hover:#18281F; --side-line:#1F3128;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 1px 2px rgba(13,26,21,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A120E; --surface:#111B16; --sunk:#16231C; --line:#21312A; --line-2:#2E4238;
  --ink:#E6EDE9; --muted:#9AA9A1; --faint:#68776F;
  --accent:#3DCB86; --accent-soft:#123222; --band:rgba(61,203,134,.13);
  --solar:#F1B53C; --solar-soft:#33270C; --wind:#76A3F2; --wind-soft:#152238;
  --fossil:#F08A5D; --fossil-soft:#3A1E12; --red:#F07B6E; --red-soft:#3A1714;
  --on-ink:#0A120E; --side:#0C1511; --side-ink:#E6EDE9; --side-muted:#8A9A91; --side-hover:#16231C; --side-line:#1B2A22; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A120E; --surface:#111B16; --sunk:#16231C; --line:#21312A; --line-2:#2E4238;
  --ink:#E6EDE9; --muted:#9AA9A1; --faint:#68776F;
  --accent:#3DCB86; --accent-soft:#123222; --band:rgba(61,203,134,.13);
  --solar:#F1B53C; --solar-soft:#33270C; --wind:#76A3F2; --wind-soft:#152238;
  --fossil:#F08A5D; --fossil-soft:#3A1E12; --red:#F07B6E; --red-soft:#3A1714;
  --on-ink:#0A120E; --side:#0C1511; --side-ink:#E6EDE9; --side-muted:#8A9A91; --side-hover:#16231C; --side-line:#1B2A22; --shadow:none; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.86em}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--cond);font-size:28px;line-height:1.15}
h2{font-size:16px}
h3{font-size:14.5px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- Connexion ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:900px){.login{grid-template-columns:1fr}.login-side{display:none}}
.login-side{background:#0D1A15;color:#E6EDE9;padding:44px;display:flex;flex-direction:column;gap:26px;min-height:100vh}
.login-side .brandl{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.login-side .q{font-family:var(--cond);font-size:34px;line-height:1.12;font-weight:600;max-width:18ch}
.login-side .q span{color:#5FD9A0}
.login-side .lead{color:#A9B8AF;max-width:52ch;font-size:15px}
.login-side .livebox{border:1px solid #1F3128;border-radius:12px;padding:16px;display:grid;gap:10px;margin-top:auto}
.login-side .livebox canvas{width:100%;height:150px;display:block}
.login-side .lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#93A39A}
.login-side .lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.login-main{display:grid;place-items:center;padding-inline:20px;padding-block:48px;position:relative}
.login-main .langpos{position:absolute;top:20px;right:20px}
.login-card{width:100%;max-width:380px;display:grid;gap:22px}
.err{background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}

/* ---------- Coquille ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:20px;padding:20px 12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px;padding:0 8px}
.side .org{padding:10px;border-radius:8px;border:1px solid var(--side-line)}
.side .org b{display:block;font-size:13.5px;line-height:1.3}
.side .org span{font-size:12px;color:var(--side-muted)}
.side .navgrp{display:grid;gap:2px}
.side .navgrp .eyebrow{color:var(--side-muted);padding:0 10px 4px;font-size:10.5px}
.side nav{display:grid;gap:14px}
.side nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--side-muted);text-align:left;padding:7px 10px;border-radius:7px;font-weight:500;font-size:14px;white-space:nowrap;width:100%}
.side nav button svg{flex:none}
.side nav button:hover{background:var(--side-hover);color:var(--side-ink)}
.side nav button[aria-current="page"]{background:var(--side-hover);color:var(--side-ink);font-weight:600;box-shadow:inset 2px 0 0 #3DCB86}
.side .foot{margin-top:auto;display:grid;gap:8px;padding:0 4px}
.side .foot .who{font-size:12.5px;color:var(--side-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .navbadge{margin-left:auto;font-size:11px;font-weight:700;background:#E0892B;color:#fff;border-radius:999px;padding:0 6px}
.side .btn.sec{background:transparent;color:var(--side-ink);border-color:var(--side-line);justify-content:flex-start}
.side .btn.sec:hover{background:var(--side-hover)}
.main{min-width:0;display:grid;align-content:start}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 32px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar .live{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.dot.warn{background:#E0892B}.dot.off{background:var(--faint)}
.topbar .sep{width:1px;height:14px;background:var(--line-2)}
.topbar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;padding:3px 9px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.content{padding-inline:32px;padding-block:28px 72px;display:grid;gap:24px;align-content:start;max-width:1240px;width:100%}
.content.narrow{max-width:980px}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px}
  .side .org,.side .navgrp .eyebrow{display:none}
  .side nav{display:flex;overflow-x:auto;order:3;width:100%;gap:2px}
  .side .navgrp{display:flex;gap:2px}
  .side .foot{margin:0 0 0 auto;grid-auto-flow:column;align-items:center}
  .side .foot .who{display:none}
  .topbar{padding-inline:16px;position:static}
  .content{padding-inline:16px;padding-block:20px 56px}
}
.page-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.page-h > div:first-child{margin-right:auto;min-width:0}
.page-h p{color:var(--muted);margin-top:4px;max-width:70ch}

/* ---------- Composants ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;background:var(--ink);color:var(--on-ink);white-space:nowrap}
.btn:hover:not(:disabled){opacity:.9}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn.sec:hover:not(:disabled){background:var(--sunk);opacity:1}
.btn.go{background:var(--accent);color:var(--on-ink)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.lg{padding:11px 18px;font-size:15px}
.btn.danger{background:var(--surface);color:var(--red);border-color:var(--line-2)}
.btn.wide{width:100%;padding-block:10px}
.info{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);font-size:11px;font-weight:600;padding:0;line-height:1;flex:none}
.info:hover{color:var(--ink);border-color:var(--ink)}
.textlink{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13.5px;text-align:left}
.textlink:hover{text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s,transform .18s}
.card:hover{border-color:var(--line-2);box-shadow:0 12px 28px rgba(24,36,28,.07)}
.card-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-h > div:first-child{margin-right:auto;min-width:0;max-width:72ch}
.card-h p{color:var(--muted);font-size:13.5px;margin-top:2px}
.title-row{display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.grid-2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:1060px){.grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}}

/* Impact client : trois chiffres, une phrase chacun */
.impact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.impact{grid-template-columns:minmax(0,1fr)}}
.imp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:6px;align-content:start}
.imp .k{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:500}
.imp .k i{width:10px;height:10px;border-radius:3px;display:inline-block}
.imp .v{font-family:var(--cond);font-size:46px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.imp .v small{font-family:var(--sans);font-size:17px;color:var(--muted);font-weight:500;margin-left:6px}
.imp .e{font-size:13.5px;color:var(--muted)}
.imp.hero{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.imp.hero .k,.imp.hero .e,.imp.hero .v small{color:color-mix(in srgb,var(--on-ink) 70%,transparent)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:16px 18px;display:grid;gap:4px;min-width:0;align-content:start}
.kpi .top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--cond);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .v small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .d{font-size:12.5px;color:var(--muted)}

.jlist{display:grid}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:6px 18px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.jrow:last-child{border-bottom:0}
.jrow:hover .jn{text-decoration:underline}
.jrow .jn{font-weight:600}
.jrow .js{font-size:12.5px;color:var(--muted)}
@media (max-width:640px){.jrow{grid-template-columns:minmax(0,1fr) auto}.jrow .jp{grid-column:1/-1}}

.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.zones{grid-template-columns:minmax(0,1fr)}}
.zone{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);display:grid;gap:10px;text-align:left;min-width:0}
button.zone:hover{border-color:var(--line-2)}
.zone[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.zone .zh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zone .zh b{font-size:15px}
.zone .zr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.zone .zr div{display:grid}
.zone .zr span{font-size:11.5px;color:var(--muted)}
.zone .zr strong{font-family:var(--cond);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.zone .zf{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.zone-source{display:flex;align-items:center;gap:7px;min-width:0;font-size:11.5px;color:var(--muted)}
.zone-source .conf{flex:none}
.zone-source span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.mix span{display:block;height:100%}

.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.scroll-x{overflow-x:auto}
svg text{font-family:var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.legend i.ln{height:3px;vertical-align:3px;border-radius:2px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-run{background:var(--accent-soft);color:var(--accent)}
.st-pause{background:var(--solar-soft);color:var(--solar)}
.st-wait{background:var(--wind-soft);color:var(--wind)}
.st-done{background:var(--sunk);color:var(--ink)}
.st-cancel{background:var(--red-soft);color:var(--red)}
.st-off{background:var(--sunk);color:var(--muted)}
.st-pend{background:var(--fossil-soft);color:var(--fossil)}
.conf{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.conf.hi{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.conf.lo{border-style:dashed}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex}
.meter span{display:block;height:100%}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px;vertical-align:1px}
.score{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 6px;border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:500}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:0 12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
tr.best td{background:var(--accent-soft)}
.tot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.cell-main{font-weight:600}
.cell-sub{font-size:12.5px;color:var(--muted)}
.empty{padding:32px 12px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search]{max-width:260px}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:stretch;padding:10px 12px 10px 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.alert i{display:block}
.alert b{display:block;font-size:13.5px}
.alert span{font-size:12.5px;color:var(--muted)}
.alert .act{align-self:center;display:flex;gap:6px}

/* Attribution */
.queue{display:grid;gap:6px}
.qitem{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.qitem[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.qitem b{font-size:14px}
.qitem span{font-size:12.5px;color:var(--muted)}
.reco{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:16px;display:grid;gap:10px}
.reco .rh{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reco .rn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:700px){.reco .rn{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reco .rn div{display:grid}
.reco .rn span{font-size:12px;color:var(--muted)}
.reco .rn strong{font-family:var(--cond);font-size:22px;font-weight:600}
.hint{font-size:13px;border-left:3px solid var(--solar);background:var(--solar-soft);padding:9px 12px;border-radius:0 8px 8px 0}

.wlist{display:grid}

<script>
/* ================= Langue ================= */
let LANG = 'fr';
try { const l = localStorage.getItem('sunshift-lang'); if (l === 'en' || l === 'fr') LANG = l; } catch (e) { }
const L = (fr, en) => LANG === 'en' ? en : fr;
let THEME = 'auto';
try { const t = localStorage.getItem('sunshift-theme'); if (['auto', 'light', 'dark'].includes(t)) THEME = t; } catch (e) { }
function applyTheme() { if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = THEME; }
applyTheme();

/* ================= Données réseau réelles ================= */
const HOUR = 3600e3, MAX_DEADLINE = 336;
const DEFAULT_SETTINGS = { rateOnDemand: 2.40, rateGreen: 1.50, rateLow: 2.10, greenScore: 60, kwh: 0.9, autoAssign: false };
const ZONES = {
  FR: { fr: 'France', en: 'France', bzn: 'FR' },
  ES: { fr: 'Espagne', en: 'Spain', bzn: 'ES' },
  DE: { fr: 'Allemagne', en: 'Germany', bzn: 'DE-LU' },
  PT: { fr: 'Portugal', en: 'Portugal', bzn: 'PT' },
  DK: { fr: 'Danemark', en: 'Denmark', bzn: 'DK1' },
  CN: { fr: 'Chine', en: 'China', bzn: '—' }
};
const ZK = Object.keys(ZONES);
const zn = z => ZONES[z] ? ZONES[z][LANG] : z;
const NWP = { meteofrance_seamless: 'Météo-France (AROME, ARPEGE)', icon_seamless: 'DWD (ICON)', dmi_seamless: 'DMI (HARMONIE)', cma_grapes_global: 'CMA (GRAPES)' };
const DEFAULT_SITES = [
  { id: 'saclay', name: 'Paris-Saclay', partner: 'Campus Saclay DC', region: 'FR', gpus: 16, hds: true },
  { id: 'lyon', name: 'Lyon', partner: 'Rhône Compute', region: 'FR', gpus: 8, hds: true },
  { id: 'madrid', name: 'Madrid', partner: 'Meseta Data', region: 'ES', gpus: 24, hds: false },
  { id: 'hambourg', name: 'Hambourg', partner: 'Nordhafen IT', region: 'DE', gpus: 16, hds: false }
];
const SITE_ZONES = [...new Set(DEFAULT_SITES.map(s => s.region))];
const SRC = () => ({ W: L('Estimé par la météo (sans mesure)', 'Weather-based estimate (no measurement)'), R: L('Réalisé', 'Measured'), D: L('Prévision des gestionnaires de réseau', 'Grid operator forecast'), M: L('Modèle météo Sunshift', 'Sunshift weather model'), E: L('Tendance ECMWF', 'ECMWF trend'), '-': L('Indisponible', 'Unavailable') });
const hourDate = h => new Date(h * HOUR);
const nowHour = () => Math.floor(Date.now() / HOUR);
const DEMO_VERSION = 'demo-v2';
const MAX_FORECAST_AGE_H = 6;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

/* Indice de surplus (0-100) : 60 % couverture de la consommation par le solaire et l'éolien, 40 % signal prix. */
function surplusScore(price, solar, wind, load) {
  const vre = load > 0 ? (solar + wind) / load : 0;

function agg(jobs) {
  const T = { n: 0, gpuh: 0, green: 0, slots: 0, base: 0, cost: 0, sav: 0, fee: 0, co2: 0, baseCo2: 0, surplus: 0, kwh: 0, ontime: 0, promised: 0, finished: 0, active: 0 };
  const now = nowHour(), ss = sites();
  for (const j of jobs) {
    if (j.pending || (j.cancelled && !j.slots.length)) continue;
    const m = metrics(j, ss), st = status(j, now); T.n++;
    T.gpuh += j.gpus * j.slots.length; T.green += m.green * j.gpus; T.slots += j.slots.length * j.gpus; T.base += m.base; T.cost += m.cost; T.sav += m.saving; T.fee += m.fee; T.co2 += m.co2Avoided; T.baseCo2 += m.baseCo2; T.surplus += m.surplusKwh; T.kwh += j.gpus * j.slots.length * j.rates.kwh;
    if (!j.cancelled) { T.promised++; if (m.onTime && !j.atRisk) T.ontime++; if (st === 'done') T.finished++; if (LIVE.includes(st)) T.active++; }
  }
  T.greenShare = T.slots ? T.green / T.slots : 0; return T;
}

function opsAlerts() {

  if (S.gridMeta) { const age = forecastAgeHours(); if (age > MAX_FORECAST_AGE_H) out.push({ level: 'warn', t: L(`Données réseau non actualisées depuis ${Math.round(age)} h`, `Grid data not refreshed for ${Math.round(age)} h`), d: L('Les nouvelles demandes sont bloquées jusqu’à réception d’une prévision fraîche.', 'New requests are blocked until a fresh forecast arrives.') }); if (gridEnd() < now + 48) out.push({ level: 'warn', t: L('Horizon de prévision trop court', 'Forecast horizon too short'), d: L(`Il reste moins de 48 h exploitables : jusqu’à ${fmtH(gridEnd())}.`, `Less than 48 usable hours remain: until ${fmtH(gridEnd())}.`) }); (S.gridMeta.errors || []).forEach(e => out.push({ level: 'warn', t: L('Erreur d’ingestion', 'Ingestion error'), d: e })); }

  pendingJobs().forEach(j => { const left = j.deadline - now - j.hours; if (left < 12) out.push({ level: 'crit', t: L(`À attribuer d’urgence : ${j.name}`, `Assign urgently: ${j.name}`), d: L(`${left} h de marge avant l’échéance`, `${left} h of slack before the deadline`), job: j.id }); });
  for (const j of S.jobs) {
    const st = status(j, now); if (!LIVE.includes(st) || st === 'pending') continue;
    const m = metrics(j, ss), c = clientById(j.clientId)?.name || '—';
    if (st === 'blocked') out.push({ level: 'crit', t: L(`Échéance menacée : ${j.name}`, `Deadline at risk: ${j.name}`), d: `${c} · ${fmtH(j.deadline)}`, job: j.id });
    else if (m.margin !== null && m.margin < 2) out.push({ level: 'warn', t: L(`Marge faible : ${j.name}`, `Low slack: ${j.name}`), d: L(`${c} · fin ${m.margin} h avant l’échéance`, `${c} · ends ${m.margin} h before deadline`), job: j.id });
  }
  ss.filter(s => !s.active).forEach(s => out.push({ level: 'warn', t: L(`${s.name} en maintenance`, `${s.name} under maintenance`), d: L('Aucun nouveau calcul n’y est planifié.', 'No new jobs are scheduled there.') }));
  return out;
}

  ${sec('score', `<div class="formula"><div class="eq">coverage = (solar + wind) / load</div><div class="eq">index = 100 × [ 0.6 × min(1, coverage / 0.8) + 0.4 × min(1, max(0, (80 − price) / 100)) ]</div><div class="eq">band = 100 × √[(0.6 × σ_coverage / 0.8)² + (0.4 × σ_price / 100)²]</div><div class="eq">score_low = max(0, index − band),  score_high = min(100, index + band)</div><div class="small muted">${L('σ_coverage combine l’incertitude solaire et éolienne calibrée ; σ_price vient de l’erreur observée du modèle de prix. Les heures futures sont retenues pour la planification uniquement si score_low ≥ seuil.', 'σ_coverage combines calibrated solar and wind uncertainty; σ_price comes from observed price-model error. Future hours are used for scheduling only when score_low ≥ threshold.')}</div></div>

function goMethod(key) {
  key = METHOD_ALIAS[key] || key; if (!METHOD().some(x => x[0] === key)) key = 'overview';
  closeDrawer(); S.methodSec = key;
  if (S.view !== 'method') { S.view = 'method'; render(); }
  else document.querySelectorAll('[data-msec]').forEach(b => b.setAttribute('aria-current', b.dataset.msec === key));
  const el = document.getElementById('m-' + key); if (el) el.scrollIntoView({ block: 'start' });
}

/* ---------- Actions ---------- */
function bindView() { drawHeat(); drawProd(); drawSignal(); drawGantt(); if ($('#snippet')) renderSnippet(); }
function renderSnippet() {
  const C = S.con || { m: 'GET', p: '/v1/jobs', b: '' }, b = (C.b || '').trim(), url = 'https://api.sunshift.eu' + C.p;
  let s;
  if (S.snipLang === 'curl') { s = `curl -X ${C.m} "${url}" \\\n  -H "Authorization: Bearer $SUNSHIFT_API_KEY"`; if (C.m === 'POST' && b) s += ` \\\n  -H "Content-Type: application/json" \\\n  -d '${b.replace(/\n\s*/g, ' ')}'`; }
  else { s = `import os, requests\n\nresp = requests.${C.m.toLowerCase()}(\n    "${url}",\n    headers={"Authorization": f"Bearer {os.environ['SUNSHIFT_API_KEY']}"},`; if (C.m === 'POST' && b) { try { s += `\n    json=${JSON.stringify(JSON.parse(b), null, 4).replace(/\n/g, '\n    ').replace(/: true/g, ': True').replace(/: false/g, ': False')},`; } catch (e) { } } s += `\n)\nprint(resp.status_code, resp.json())`;
    if (/\/control$/.test(C.p)) s = `import os, time, requests\n\nAPI = "https://api.sunshift.eu/v1"\nH = {"Authorization": f"Bearer {os.environ['SUNSHIFT_API_KEY']}"}\n\n# ${L('Boucle de l’agent sur votre cluster', 'Agent loop on your cluster')}\nwhile True:\n    c = requests.get(f"{API}${C.p.replace('/v1', '')}", headers=H).json()\n    if c["action"] == "run":\n        resume_job()          # ${L('reprend depuis le dernier point de sauvegarde', 'resume from last checkpoint')}\n    elif c["action"] == "pause":\n        checkpoint_and_pause()\n    elif c["action"] == "stop":\n        break\n    time.sleep(60)`; }
  const el = $('#snippet'); if (el) el.textContent = s;
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast(L('Copié.', 'Copied.')); } catch (e) { toast(L('Copie impossible ici : sélectionnez le texte manuellement.', 'Copy unavailable here: select the text manually.')); } }
function buildCsv() {
  const list = reportRows(), ss = sites(), num = v => LANG === 'en' ? (+v).toFixed(2) : (+v).toFixed(2).replace('.', ','), sep = LANG === 'en' ? ',' : ';';
  const rows = [[L('Référence', 'Reference'), L('Calcul', 'Job'), L('Soumis le', 'Submitted'), 'Data center', 'GPU·h', L('Sur excédent (%)', 'On surplus (%)'), L('Économie nette (€)', 'Net savings (€)'), L('CO2 évité (kg)', 'CO2 avoided (kg)'), L('Montant facturé (€)', 'Invoiced (€)'), L('Statut', 'Status')]];
  list.forEach(j => { const m = metrics(j, ss); rows.push([j.ref, j.name, hourDate(j.submittedAt).toLocaleString(loc()), siteOf(j, ss)?.name || '', j.gpus * j.slots.length, Math.round(m.greenShare * 100), num(m.net), num(m.co2Avoided), num(m.invoice), STATUS_UI(status(j, nowHour()))[0]]); });
  return '﻿' + rows.map(r => r.map(v => { const s = String(v); return new RegExp(`[${sep}"\\n]`).test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(sep)).join('\n');
}
async function exportCsv() {
  const csv = buildCsv(), c = clientById(S.session.clientId);
  const fname = `sunshift-${String(c?.name || 'client').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-')}-${S.reportMonth}.csv`;
  let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) { }
  if (dl) { try { await dl.save({ filename: fname, data: csv }); toast(L('Fichier téléchargé.', 'File downloaded.')); } catch (e) { if (e?.code !== 'declined') toast(L('Téléchargement impossible dans cette vue.', 'Download unavailable in this view.')); } return; }
  exportCsv.last = csv;
  openDrawer('CSV', L('Export', 'Export'), `<textarea class="code" readonly style="min-height:300px">${esc(csv)}</textarea><div><button class="btn sec" data-act="copycsv">${L('Copier', 'Copy')}</button></div>`);
}
async function setSettings(patch) { const v = { ...S.settings, ...patch }; delete v.id; if (await write(() => S.store.set('settings', 'main', v))) { S.settings = v; return true; } return false; }
async function refreshForecasts(manual = false) {
  if (S.mode === 'local' && S.store?.refreshDemo) {
    S.store.refreshDemo();
    if (manual) toast(L('Prévisions locales recalées sur l’heure actuelle.', 'Local forecasts aligned with the current time.'));
    return true;
  }
  gridReset(); autoReplan();
  if (S.session && !document.activeElement?.closest?.('.content form')) render();
  if (manual) toast(L('Synchronisation demandée. Les données se mettent à jour dès la prochaine publication.', 'Sync requested. Data updates with the next publication.'));
  return false;
}

document.addEventListener('click', async e => {
  const t = e.target;

  if (t.id === 'reqSend') { await sendApi(t); return; }
  const ms = t.closest('[data-msec]'); if (ms) { goMethod(ms.dataset.msec); return; }

  const hb = t.closest('[data-help]'); if (hb) { openHelp(hb.dataset.help); return; }

  const mv = t.closest('[data-move]'); if (mv) { mv.disabled = true; const ok = await write(() => S.store.update('jobs', mv.dataset.move, { site: mv.dataset.site, siteLocked: true, slots: [] })); if (ok) { const j = S.jobs.find(x => x.id === mv.dataset.move); Object.assign(j, { site: mv.dataset.site, siteLocked: true, slots: [] }); await replanAll(); toast(L('Calcul déplacé et replanifié.', 'Job moved and replanned.')); render(); } else mv.disabled = false; return; }
  const pd = t.closest('[data-pend]'); if (pd) { S.selPending = pd.dataset.pend; if (S.view !== 'assign') { S.view = 'assign'; closeDrawer(); } render(); return; }
  const zb = t.closest('[data-zone]'); if (zb) { S.zone = zb.dataset.zone; if (zb.dataset.view) S.view = zb.dataset.view; render(); return; }
  const v = t.closest('[data-view]'); if (v && !t.closest('#drawer')) { S.view = v.dataset.view; S.search = ''; S.jobFilter = 'all'; S.clientFilter = 'all'; closeDrawer(); render(); scrollTo(0, 0); return; }
  const jb = t.closest('[data-job]'); if (jb) { openJobDrawer(jb.dataset.job); return; }
  const cb = t.closest('[data-client]'); if (cb) { openClientForm(cb.dataset.client); return; }
  const sb = t.closest('[data-seg] [data-v]'); if (sb) { S[sb.parentElement.dataset.seg] = sb.dataset.v; render(); return; }
  const ep = t.closest('[data-ep]'); if (ep) { loadEndpoint(+ep.dataset.ep); render(); return; }
  const cap = t.closest('[data-site-cap]'); if (cap) { const id = cap.dataset.siteCap, val = Math.round(+$('#cap-' + id).value); if (!(val >= 1 && val <= 256)) { toast(L('Capacité invalide : 1 à 256 GPU.', 'Invalid capacity: 1 to 256 GPUs.')); return; } const s = sites().find(x => x.id === id); cap.disabled = true; if (await write(() => S.store.set('sites', id, { active: s.active, gpus: val }))) { S.siteOv[id] = { ...(S.siteOv[id] || {}), active: s.active, gpus: val }; await replanAll(); toast(L(`${s.name} : ${val} GPU. Planning mis à jour.`, `${s.name}: ${val} GPUs. Plan updated.`)); } cap.disabled = false; return; }
  const a = t.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'logout') logout();
  else if (act === 'refresh') { a.disabled = true; await refreshForecasts(true); a.disabled = false; }
  else if (act === 'theme') { THEME = THEME === 'auto' ? 'dark' : THEME === 'dark' ? 'light' : 'auto'; try { localStorage.setItem('sunshift-theme', THEME); } catch (x) { } applyTheme(); render(); }
  else if (act === 'newjob') openNewJob();
  else if (act === 'newclient') openClientForm(null);
  else if (act === 'csv') exportCsv();
  else if (act === 'copycsv') copyText(exportCsv.last || '');
  else if (act === 'replan') { a.disabled = true; if (await replanAll()) toast(L('Planning recalculé.', 'Plan recalculated.')); a.disabled = false; }

  else if (act === 'copykey') copyText(clientById(S.session.clientId)?.apiKey || '');
  else if (act === 'rotatekey') {

    else { a.dataset.confirm = '1'; a.textContent = L('Confirmer', 'Confirm'); a.classList.add('danger'); setTimeout(() => { if (document.contains(a)) { delete a.dataset.confirm; a.textContent = L('Régénérer', 'Rotate'); a.classList.remove('danger'); } }, 5000); }
  }

  else if (act === 'askcancel') { const z = $('#cancelZone'); z.dataset.confirm = '1'; z.innerHTML = `<div class="callout warn" style="display:grid;gap:10px"><span>${L('Annuler ce calcul ? Les heures déjà calculées restent facturées.', 'Cancel this job? Hours already computed remain billed.')}</span><div style="display:flex;gap:8px"><button class="btn danger" data-act="docancel">${L('Oui, annuler', 'Yes, cancel')}</button><button class="btn sec" data-act="keep">${L('Non', 'No')}</button></div></div>`; }

async function sendApi(btn) {
  btn.disabled = true; const t0 = performance.now();
  S.con.m = $('#reqMethod').value; S.con.p = $('#reqPath').value.trim(); S.con.b = $('#reqBody')?.value || '';
  const r = await api(S.con.m, S.con.p, S.con.b);
  S.con.code = r.status; S.con.time = Math.round(performance.now() - t0 + 40) + ' ms'; S.con.resp = JSON.stringify(r.body, null, 2);
  render();
}
document.addEventListener('change', async e => {

  else if (t.id === 'autoAssign' || t.id === 'autoAssign2') { if (await setSettings({ autoAssign: t.checked })) toast(t.checked ? L('Attribution automatique activée.', 'Auto-assignment on.') : L('Chaque demande sera validée par un opérateur.', 'Each request will be approved by an operator.')); else t.checked = !t.checked; render(); }
  else if (t.closest && t.closest('#jobForm')) updatePreview();
  else if (t.dataset.siteActive) { const id = t.dataset.siteActive, s = sites().find(x => x.id === id); if (await write(() => S.store.set('sites', id, { active: t.checked, gpus: s.gpus }))) { S.siteOv[id] = { ...(S.siteOv[id] || {}), active: t.checked, gpus: s.gpus }; await replanAll(); toast(L('Planning mis à jour.', 'Plan updated.')); } else t.checked = !t.checked; }
});
let searchT, prevT; document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'jobSearch') { clearTimeout(searchT); searchT = setTimeout(() => { S.search = t.value; const pos = t.selectionStart; render(); const n = $('#jobSearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
  else if (t.id === 'preview') { S.previewOffset = +t.value; $('#previewLbl').textContent = S.previewOffset ? '+' + S.previewOffset + ' h · ' + fmtH(nowHour() + S.previewOffset) : L('maintenant', 'now'); drawGantt(); }
  else if ((t.id === 'reqPath' || t.id === 'reqBody') && S.con) { S.con[t.id === 'reqPath' ? 'p' : 'b'] = t.value; renderSnippet(); }
  else if (t.id === 'fGpus' || t.id === 'fHours') { clearTimeout(prevT); prevT = setTimeout(updatePreview, 200); }
});
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'loginForm') {
    const el = $('#loginErr');
    if (Date.now() < S.lockUntil) { el.hidden = false; el.textContent = L(`Trop de tentatives. Réessayez dans ${Math.ceil((S.lockUntil - Date.now()) / 1000)} s.`, `Too many attempts. Try again in ${Math.ceil((S.lockUntil - Date.now()) / 1000)} s.`); return; }
    $('#lBtn').disabled = true;
    const r = await tryLogin($('#lEmail').value, $('#lPw').value);
    if (!r.ok) { $('#lBtn').disabled = false; S.fails++; if (S.fails >= 5) { S.lockUntil = Date.now() + 30000; S.fails = 0; } el.hidden = false; el.textContent = r.msg; $('#lPw').value = ''; $('#lPw').focus(); return; }
    S.fails = 0; startSession(r.session);
  }
  else if (f.id === 'jobForm') {
    const btn = $('#jobBtn'); btn.disabled = true;
    const r = await createJob(S.session.clientId, { ...formData(), _via: 'console' });
    if (!r.job) { btn.disabled = false; const el = $('#jobErr'); el.hidden = false; el.textContent = r.error[1]; return; }
    toast(r.job.pending ? L('Demande reçue. L’équipe Sunshift confirme son attribution.', 'Request received. The Sunshift team is confirming its assignment.') : L('Demande planifiée.', 'Request scheduled.'));
    render(); openJobDrawer(r.job.id);
  }
  else if (f.id === 'pwForm') {
    const c = clientById(S.session.clientId), p0 = $('#pw0').value, p1 = $('#pw1').value, p2 = $('#pw2').value;
    if ((await sha(c.salt, p0)) !== c.hash) { toast(L('Mot de passe actuel incorrect.', 'Current password is incorrect.')); return; }
    if (p1.length < 10) { toast(L('10 caractères minimum.', 'At least 10 characters.')); return; }
    if (p1 !== p2) { toast(L('Les mots de passe ne correspondent pas.', 'Passwords do not match.')); return; }
    const salt = rhex(6), hash = await sha(salt, p1);
    if (await write(() => S.store.update('clients', c.id, { salt, hash }))) { f.reset(); toast(L('Mot de passe mis à jour.', 'Password updated.')); }
  }
  else if (f.id === 'clientForm') {
    const id = f.dataset.id, el = $('#clientErr'), name = $('#cName').value.trim(), email = $('#cEmail').value.trim().toLowerCase(), pw = $('#cPw').value;
    const fail = m => { el.hidden = false; el.textContent = m; };
    if (!name) return fail(L('Le nom est obligatoire.', 'Name is required.'));
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail(L('Adresse e-mail invalide.', 'Invalid email address.'));
    if (OPS_USERS.some(u => u.email === email) || S.clients.some(c => String(c.email).toLowerCase() === email && c.id !== id)) return fail(L('Adresse déjà utilisée.', 'Address already in use.'));
    if ((!id || pw) && pw.length < 10) return fail(L('10 caractères minimum.', 'At least 10 characters.'));
    const patch = { name, email, fee: Math.min(50, Math.max(5, +$('#cFee').value || 25)) / 100, quota: Math.max(0, Math.round(+$('#cQuota').value || 0)), hdsAllowed: $('#cHds').checked };
    if (pw) { patch.salt = rhex(6); patch.hash = await sha(patch.salt, pw); }
    if (id) { patch.status = $('#cSusp').checked ? 'suspended' : 'active'; if (await write(() => S.store.update('clients', id, patch))) { toast(L('Client mis à jour.', 'Client updated.')); closeDrawer(); } }
    else { const nid = 'cli_' + rid(10); if (await write(() => S.store.set('clients', nid, { ...patch, status: 'active', apiKey: 'sk_live_' + rhex(20), createdAt: new Date().toISOString() }))) { toast(L(`Compte créé pour ${name}.`, `Account created for ${name}.`)); closeDrawer(); } }
  }
  else if (f.id === 'setForm') {
    const v = { rateOnDemand: +$('#sOd').value, rateGreen: +$('#sGr').value, rateLow: +$('#sLo').value, greenScore: Math.round(+$('#sGs').value), kwh: +$('#sKw').value };
    if (Object.values(v).some(x => !isFinite(x)) || v.kwh <= 0 || v.greenScore < 30 || v.greenScore > 90) { toast(L('Valeurs invalides.', 'Invalid values.')); return; }
    if (v.rateGreen > v.rateOnDemand || v.rateLow > v.rateOnDemand) { toast(L('Les tarifs de capacité inactive doivent rester sous le tarif de référence.', 'Idle capacity prices must stay below the reference price.')); return; }
    if (await setSettings(v)) { toast(L('Réglages enregistrés.', 'Settings saved.')); document.activeElement?.blur(); render(); }
  }
});
$('#drawerClose').addEventListener('click', closeDrawer); $('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#drawer').hidden) closeDrawer(); });
setInterval(() => { const h = nowHour(); if (h !== S.lastHour) { S.lastHour = h; if (S.mode === 'local' && S.store?.refreshDemo) S.store.refreshDemo(); else { gridReset(); autoReplan(); } if (S.session && $('#drawer').hidden && !document.activeElement?.matches('input,textarea,select')) render(); } }, 30000);

/* ---------- Démarrage ---------- */
(function boot() {
  try { const s = JSON.parse(sessionStorage.getItem('sunshift-session')); if (s && s.role) { S.session = s; S.view = s.role === 'ops' ? 'pilot' : 'home'; } } catch (e) { }
  if (S.session && S.session.role === 'client') $('#app').innerHTML = `<div class="boot">${L('Chargement…', 'Loading…')}</div>`;
  else if (S.session) render(); else renderLogin();
  initStore().then(() => { updateLoginNote(); });
})();
</script>
